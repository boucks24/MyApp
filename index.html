<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App Shelf">
<meta name="theme-color" content="#131418">
<title>App Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131418;
    --panel:#1D1F25;
    --line:#2C2F37;
    --chalk:#EDE9E2;
    --muted:#8A8D96;
    --muted-dim:#63666E;
    --iron:#C1442B;
    --font-display:'Oswald', system-ui, -apple-system, sans-serif;
    --font-body:'Space Grotesk', system-ui, -apple-system, sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    overflow:hidden;
  }

  /* ---------- the deck ---------- */
  .deck{
    height:100dvh;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .deck::-webkit-scrollbar{display:none;}

  .panel{
    scroll-snap-align:center;
    scroll-snap-stop:always;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:
      calc(28px + env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      calc(60px + env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
    /* Each app tints its own panel from its own brand colour. */
    background-image:radial-gradient(120% 70% at 50% 18%, var(--tint) 0%, var(--bg) 62%);
  }

  .panel-link{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:4px;
    text-decoration:none;
    color:inherit;
    width:100%;
    max-width:520px;
  }
  .panel-link:focus-visible{outline:2px solid var(--accent); outline-offset:14px; border-radius:18px;}

  .kicker{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted-dim);
    margin:0 0 14px;
    min-height:13px;
  }
  .kicker.recent{color:var(--accent);}

  .name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(34px,10vw,66px);
    line-height:.96;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    margin:0;
  }
  .desc{
    color:var(--muted);
    font-size:clamp(13.5px,3.4vw,16px);
    line-height:1.55;
    margin:12px auto 0;
    max-width:40ch;
  }
  .cta{
    margin-top:26px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--chalk);
    border:1px solid var(--line);
    background:rgba(29,31,37,.7);
    border-radius:999px;
    padding:12px 22px;
    transition:background .2s var(--ease), border-color .2s var(--ease), transform .16s var(--ease);
  }
  .panel-link:hover .cta{background:var(--accent); border-color:var(--accent); color:var(--accent-ink,#fff);}
  .panel-link:active .cta{transform:scale(.97);}

  /* ---------- the art stage ---------- */
  .art{
    position:relative;
    width:min(232px, 54vw);
    height:min(232px, 54vw);
    margin-bottom:28px;
    flex:0 0 auto;
  }
  .art i{
    position:absolute;
    display:block;
    transform-origin:center;
  }

  /* 5/3/1: plate stack seen end-on, in the plate-weight colours. */
  .art-531 i{border-radius:50%;}
  .art-531 i:nth-child(1){inset:0; background:#2E6FA7;}
  .art-531 i:nth-child(2){inset:13%; background:#C79A2E;}
  .art-531 i:nth-child(3){inset:27%; background:#C1442B;}
  .art-531 i:nth-child(4){inset:41%; background:#4F8B4A;}
  .art-531 i:nth-child(5){
    inset:47% -18%; height:6%; border-radius:3px;
    background:linear-gradient(90deg,#7E8390,#C9CDD6,#7E8390);
  }

  /* Court allocator: a court plan, net and ball. */
  .art-court i:nth-child(1){inset:12% 4%; border:2px solid rgba(244,241,232,.42); border-radius:4px; background:rgba(36,74,61,.55);}
  .art-court i:nth-child(2){left:50%; top:8%; bottom:8%; width:2px; margin-left:-1px; background:#F4F1E8;}
  .art-court i:nth-child(3){inset:34% 4%; border-top:2px solid rgba(244,241,232,.3); border-bottom:2px solid rgba(244,241,232,.3);}
  .art-court i:nth-child(4){width:13%; height:13%; right:11%; bottom:16%; border-radius:50%; background:#D7E05B;}

  /* Rally clipper: a rally arc, ball trailing along it. */
  .art-rally i:nth-child(1){inset:4%; border:2px solid rgba(215,224,91,.5); border-radius:50%; clip-path:polygon(0 0,100% 0,100% 78%,0 78%);}
  .art-rally i:nth-child(2){inset:21%; border:2px solid rgba(215,224,91,.3); border-radius:50%; clip-path:polygon(0 0,100% 0,100% 80%,0 80%);}
  .art-rally i:nth-child(3){width:15%; height:15%; left:4%; top:62%; border-radius:50%; background:#D7E05B;}
  .art-rally i:nth-child(4){width:9%; height:9%; left:45%; top:4%; border-radius:50%; background:rgba(215,224,91,.6);}
  .art-rally i:nth-child(5){width:7%; height:7%; right:5%; top:58%; border-radius:50%; background:rgba(215,224,91,.35);}

  /* Underpaint: three pigments overlapping where they mix. */
  .art-paint i{border-radius:52% 48% 57% 43% / 50% 55% 45% 50%; mix-blend-mode:screen;}
  .art-paint i:nth-child(1){inset:4% 30% 34% 4%; background:#C0562F;}
  .art-paint i:nth-child(2){inset:18% 6% 22% 26%; background:#2F5FA8;}
  .art-paint i:nth-child(3){inset:34% 22% 6% 16%; background:#D69A3D;}

  /* Scoreboard: a bar of live scores. */
  .art-score i{bottom:14%; width:15%; border-radius:4px 4px 2px 2px; background:#3DDC97;}
  .art-score i:nth-child(1){left:6%; height:40%; background:#233252;}
  .art-score i:nth-child(2){left:26%; height:68%;}
  .art-score i:nth-child(3){left:46%; height:30%; background:#233252;}
  .art-score i:nth-child(4){left:66%; height:84%; background:#FF5A5F;}
  .art-score i:nth-child(5){left:86%; height:52%; background:#233252;}

  /* Sketchpad: one drawn stroke on paper. */
  .art-sketch i:nth-child(1){inset:6%; border-radius:12px; background:#FAF6EC;}
  .art-sketch i:nth-child(2){
    inset:26% 18% 30% 18%;
    border:0 solid transparent; border-bottom:7px solid #2B2620; border-left:7px solid #2B2620;
    border-radius:0 0 0 88%;
    transform:rotate(-8deg);
  }
  .art-sketch i:nth-child(3){width:14%; height:14%; right:20%; top:24%; border-radius:50%; background:#3E6FF2;}

  /* Swatch finder: a marker chart, one swatch found. */
  .art-swatch i{width:28%; height:40%; border-radius:5px;}
  .art-swatch i:nth-child(1){left:5%; top:7%; background:#E8A0A8;}
  .art-swatch i:nth-child(2){left:36%; top:7%; background:#C4576A;}
  .art-swatch i:nth-child(3){left:67%; top:7%; background:#8C4A6B;}
  .art-swatch i:nth-child(4){left:5%; top:53%; background:#6FA8C4;}
  .art-swatch i:nth-child(5){left:36%; top:53%; background:#E8C97A; box-shadow:0 0 0 3px #2F5FE0;}
  .art-swatch i:nth-child(6){left:67%; top:53%; background:#7EA86F;}

  /* ---------- the slide in / slide out ---------- */
  @media (prefers-reduced-motion:no-preference){
    .panel-link > *{
      opacity:0;
      transition:opacity .5s var(--ease), transform .62s var(--ease);
    }
    /* Art enters from the leading edge, copy from the trailing one, so each
       panel reads as one object sliding through rather than a fade. */
    .panel .art{transform:translate3d(-16vw,0,0) scale(.94);}
    .panel .kicker, .panel .name, .panel .desc, .panel .cta{transform:translate3d(9vw,0,0);}

    .panel.in .art{opacity:1; transform:none;}
    .panel.in .kicker, .panel.in .name, .panel.in .desc, .panel.in .cta{opacity:1; transform:none;}
    .panel.in .kicker{transition-delay:.04s;}
    .panel.in .name{transition-delay:.08s;}
    .panel.in .desc{transition-delay:.14s;}
    .panel.in .cta{transition-delay:.2s;}

    /* Leaving upward, the panel pushes out the opposite way it came in. */
    .panel.out-up .art{transform:translate3d(16vw,0,0) scale(.94);}
    .panel.out-up .kicker, .panel.out-up .name, .panel.out-up .desc, .panel.out-up .cta{transform:translate3d(-9vw,0,0);}

    .art i{transition:transform .7s var(--ease);}
    .panel .art i{transform:scale(.82);}
    .panel.in .art i{transform:none;}
    .panel.in .art i:nth-child(2){transition-delay:.05s;}
    .panel.in .art i:nth-child(3){transition-delay:.1s;}
    .panel.in .art i:nth-child(4){transition-delay:.15s;}
    .panel.in .art i:nth-child(5){transition-delay:.2s;}
    .panel.in .art i:nth-child(6){transition-delay:.25s;}
  }

  /* ---------- progress rail ---------- */
  .dots{
    position:fixed;
    right:max(12px, env(safe-area-inset-right));
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:10;
  }
  .dots button{
    width:8px; height:8px; padding:0;
    border-radius:50%;
    border:none;
    background:var(--line);
    cursor:pointer;
    transition:background .25s var(--ease), transform .25s var(--ease);
  }
  .dots button:hover{background:var(--muted);}
  .dots button:focus-visible{outline:2px solid var(--chalk); outline-offset:3px;}
  .dots button.on{background:var(--accent-dot,var(--iron)); transform:scale(1.5);}

  /* ---------- masthead + scroll affordance ---------- */
  .mark{
    position:fixed;
    top:calc(18px + env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted-dim);
    z-index:10;
    pointer-events:none;
  }
  .mark .dot{color:var(--iron);}

  .stamp{
    position:fixed;
    bottom:calc(16px + env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    font-size:10.5px;
    color:var(--muted-dim);
    z-index:10;
    text-align:center;
    pointer-events:none;
    letter-spacing:.02em;
  }

  @media (prefers-reduced-motion:reduce){
    .deck{scroll-behavior:auto;}
    *{animation:none !important; transition:none !important;}
  }

  .noscript-list{padding:40px 20px; text-align:center;}
  .noscript-list a{display:block; padding:14px; color:var(--chalk);}
</style>
</head>
<body>

<div class="mark" aria-hidden="true">App<span class="dot">.</span>Shelf</div>
<div class="deck" id="deck"></div>
<nav class="dots" id="dots" aria-label="Jump to app"></nav>
<div class="stamp" id="stamp"></div>

<noscript>
  <div class="noscript-list">
    <a href="apps/531-bbb/">5/3/1 BBB</a>
    <a href="apps/rally-clipper/">Tennis Analysis</a>
    <a href="apps/underpaint/">Underpaint</a>
    <a href="apps/scoreboard/">Scoreboard</a>
    <a href="apps/court-allocator/">Court Allocator</a>
    <a href="apps/sketchpad/">Sketchpad</a>
    <a href="apps/swatch-finder/">Swatch Finder</a>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  // Default order. With no usage recorded yet the deck opens on 5/3/1 BBB;
  // once apps have been opened, most-recent leads and anything never opened
  // keeps this order behind it.
  var APPS = [
    {id:'531-bbb',         href:'apps/531-bbb/',         name:'5/3/1 BBB',       art:'art-531',    tint:'#241A1A', accent:'#C1442B',
     desc:'Workout planner and log.'},
    {id:'rally-clipper',   href:'apps/rally-clipper/',   name:'Tennis Analysis', art:'art-rally',  tint:'#17251F', accent:'#D7E05B',
     desc:"Auto-clip rallies from a match video, sync footage to your watch's .fit data, or explore a route and wellness file on its own."},
    {id:'underpaint',      href:'apps/underpaint/',      name:'Underpaint',      art:'art-paint',  tint:'#241F1A', accent:'#D69A3D',
     desc:'Mix paint colours, pull a palette from a photo, simplify to vector.'},
    {id:'scoreboard',      href:'apps/scoreboard/',      name:'Scoreboard',      art:'art-score',  tint:'#141C2C', accent:'#3DDC97',
     desc:'Live and upcoming: tennis 500+, AFL, rugby union, cricket.'},
    {id:'court-allocator', href:'apps/court-allocator/', name:'Court Allocator', art:'art-court',  tint:'#17251F', accent:'#D7E05B',
     desc:'Randomly assign social tennis players to courts.'},
    {id:'sketchpad',       href:'apps/sketchpad/',       name:'Sketchpad',       art:'art-sketch', tint:'#1F1E1C', accent:'#3E6FF2',
     desc:'A blank canvas to doodle or sketch, saved on this device.'},
    {id:'swatch-finder',   href:'apps/swatch-finder/',   name:'Swatch Finder',   art:'art-swatch', tint:'#1B1C20', accent:'#2F5FE0',
     desc:'Look up an Ohuhu marker by code or name. See its colour and where it sits on the sheet.'}
  ];

  var STORE = 'shelf:lastUsed';
  var deck = document.getElementById('deck');
  var dotsNav = document.getElementById('dots');

  function readUsage(){
    try {
      var raw = localStorage.getItem(STORE);
      return raw ? (JSON.parse(raw) || {}) : {};
    } catch(e){ return {}; }   // private mode, blocked storage, corrupt JSON
  }

  function ordered(){
    var used = readUsage();
    // Stable: used apps by most-recent first, then never-opened apps in the
    // default order above (which starts on 5/3/1 BBB).
    var seen = [], unseen = [];
    APPS.forEach(function(a){ (used[a.id] ? seen : unseen).push(a); });
    seen.sort(function(x, y){ return used[y.id] - used[x.id]; });
    return seen.concat(unseen);
  }

  function relTime(ts){
    if (!ts) return '';
    var mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) return 'Just now';
    if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    var days = Math.round(hrs / 24);
    if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
    return 'A while ago';
  }

  var list = ordered();
  var used = readUsage();

  // Built synchronously during parse so the first panel is painted with the
  // rest of the page: no flash of an empty deck, no reordering jump.
  var frag = document.createDocumentFragment();
  list.forEach(function(app, i){
    var sec = document.createElement('section');
    sec.className = 'panel';
    sec.style.setProperty('--tint', app.tint);
    sec.style.setProperty('--accent', app.accent);
    sec.dataset.index = i;

    var shots = app.art === 'art-swatch' ? 6 : (app.art === 'art-paint' ? 3 : 5);
    var pips = '';
    for (var n = 0; n < shots; n++) pips += '<i></i>';

    var label = used[app.id] ? relTime(used[app.id]) : (i === 0 ? 'Start here' : '');

    sec.innerHTML =
      '<a class="panel-link" href="' + app.href + '" data-id="' + app.id + '">' +
        '<span class="art ' + app.art + '" aria-hidden="true">' + pips + '</span>' +
        '<p class="kicker' + (used[app.id] ? ' recent' : '') + '">' + label + '</p>' +
        '<h2 class="name">' + app.name + '</h2>' +
        '<p class="desc">' + app.desc + '</p>' +
        '<span class="cta">Open</span>' +
      '</a>';
    frag.appendChild(sec);
  });
  deck.appendChild(frag);

  var panels = Array.prototype.slice.call(deck.querySelectorAll('.panel'));

  // Progress rail
  list.forEach(function(app, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', app.name);
    b.addEventListener('click', function(){
      panels[i].scrollIntoView({block:'center'});
    });
    dotsNav.appendChild(b);
  });
  var dots = Array.prototype.slice.call(dotsNav.children);

  // Drives the slide in / slide out. A panel above the viewport gets `out-up`
  // so it leaves the way it arrived, rather than snapping back to its
  // entry offset while still partly visible.
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      var p = en.target;
      if (en.isIntersecting && en.intersectionRatio > 0.5){
        p.classList.add('in');
        p.classList.remove('out-up');
        var idx = +p.dataset.index;
        dots.forEach(function(d, i){ d.classList.toggle('on', i === idx); });
        dotsNav.style.setProperty('--accent-dot', list[idx].accent);
      } else {
        p.classList.remove('in');
        if (en.boundingClientRect.top < 0) p.classList.add('out-up');
        else p.classList.remove('out-up');
      }
    });
  }, {threshold:[0, 0.5, 0.9]});
  panels.forEach(function(p){ io.observe(p); });

  // First panel is in view at load, before any scroll happens.
  requestAnimationFrame(function(){ panels[0].classList.add('in'); });

  // ---- launch: record usage, and make the navigation itself instant ----

  function remember(id){
    try {
      var u = readUsage();
      u[id] = Date.now();
      localStorage.setItem(STORE, JSON.stringify(u));
    } catch(e){ /* storage unavailable: ordering just stays at the default */ }
  }

  // pointerdown fires well before the click completes, so the write and the
  // prefetch are already done by the time navigation starts.
  deck.addEventListener('pointerdown', function(e){
    var link = e.target.closest('.panel-link');
    if (link) prefetch(link.getAttribute('href'));
  }, {passive:true});

  deck.addEventListener('click', function(e){
    var link = e.target.closest('.panel-link');
    if (link) remember(link.dataset.id);
  });

  var prefetched = {};
  function prefetch(href){
    if (!href || prefetched[href]) return;
    prefetched[href] = true;
    var l = document.createElement('link');
    l.rel = 'prefetch';
    l.href = href;
    document.head.appendChild(l);
  }

  // Warm every app once the deck itself is done loading, so a tap navigates
  // to an already-cached document instead of starting a fresh request.
  function warmAll(){ list.forEach(function(a){ prefetch(a.href); }); }
  if ('requestIdleCallback' in window) requestIdleCallback(warmAll, {timeout:2500});
  else setTimeout(warmAll, 900);

  // ---- last-deployed stamp ----
  var stamp = document.getElementById('stamp');
  fetch(location.pathname, {cache:'no-store', method:'HEAD'})
    .then(function(res){
      var lm = res.headers.get('last-modified');
      stamp.textContent = lm
        ? 'Updated ' + new Date(lm).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'})
        : '';
    })
    .catch(function(){ stamp.textContent = ''; });
})();
</script>
</body>
</html>
