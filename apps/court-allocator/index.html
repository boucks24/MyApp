<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Court Allocator">
<title>Court Allocator</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --court:#244A3D;
    --deep:#12241E;
    --court-lift:#2A5546;
    --line:#F4F1E8;
    --clay:#C1622E;
    --ball:#D7E05B;
    --ink:#16211D;
    --r:14px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:#163027;
    background-image:radial-gradient(130% 70% at 50% 0%, #1F4034 0%, #132520 62%);
    background-attachment:fixed;
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    color:var(--line);
    min-height:100dvh;
    padding:calc(20px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));
  }
  .wrap{max-width:480px;margin:0 auto;}

  .back-link{
    display:inline-flex;align-items:center;gap:5px;
    color:rgba(244,241,232,.8);
    font-size:12.5px;font-weight:700;
    text-decoration:none;
    margin-bottom:22px;
    padding:9px 15px 9px 12px;
    border-radius:999px;
    border:1px solid rgba(244,241,232,.2);
    background:rgba(36,74,61,.75);
    min-height:38px;
    touch-action:manipulation;
    transition:background .18s var(--ease), color .18s var(--ease);
  }
  .back-link .back-arrow{font-size:16px;line-height:1;}
  .back-link:hover,.back-link:active{color:var(--line);background:var(--court-lift);}
  .back-link:focus-visible{outline:2px solid var(--ball);outline-offset:2px;}

  header{text-align:center; margin-bottom:22px;}
  h1{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(34px,10vw,46px);
    line-height:.94;
    margin:0;
    letter-spacing:-0.02em;
    text-transform:uppercase;
  }
  .sub{
    color:rgba(244,241,232,.62);
    font-size:14px;
    margin:9px auto 0;
    max-width:36ch;
  }

  /* ---------- the tap target: the page's one hero moment ---------- */
  .result-card{
    position:relative;
    display:block;
    width:100%;
    background:var(--court);
    border:1px solid rgba(244,241,232,.14);
    border-radius:var(--r);
    padding:30px 20px 26px;
    text-align:center;
    margin-bottom:12px;
    overflow:hidden;
    cursor:pointer;
    user-select:none;
    isolation:isolate;
    transition:background .16s var(--ease), transform .12s var(--ease);
  }
  /* Court lines, drawn to scale: baseline, service line, centre mark.
     Replaces the old decorative corner circle with the real geometry. */
  /* Court plan watermark: an inset baseline rectangle with the centre mark,
     drawn as an outline so it never sits across the card's own text. */
  .result-card::before{
    content:"";
    position:absolute;
    left:14px;right:14px;top:12px;bottom:12px;
    z-index:-1;
    border:1px solid rgba(244,241,232,.09);
    border-radius:6px;
    background:linear-gradient(to right,
      transparent calc(50% - 1px),
      rgba(244,241,232,.09) calc(50% - 1px),
      rgba(244,241,232,.09) calc(50% + 1px),
      transparent calc(50% + 1px));
    pointer-events:none;
  }
  .result-card:hover{background:var(--court-lift);}
  .result-card:active{transform:scale(.985);}
  .result-card:focus-visible{outline:2px solid var(--ball);outline-offset:3px;}
  .result-card.disabled{cursor:not-allowed;opacity:.5;}

  .result-label{
    font-size:11px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;
    color:rgba(244,241,232,.5);
    margin-bottom:6px;
  }
  .result-value{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(68px,22vw,104px);
    line-height:.9;
    color:var(--ball);
    letter-spacing:-0.03em;
    display:block;
  }
  .result-value.pop{animation:pop .34s var(--ease);}
  @keyframes pop{
    0%{transform:scale(.82);opacity:.35;}
    62%{transform:scale(1.04);}
    100%{transform:scale(1);opacity:1;}
  }
  .result-sub{
    margin-top:10px;
    font-size:13px;
    color:rgba(244,241,232,.6);
    min-height:19px;
  }

  button{
    width:100%;
    background:var(--ball);
    color:var(--ink);
    border:none;
    border-radius:10px;
    padding:16px;
    font-family:'Archivo Black',sans-serif;
    font-size:16px;
    letter-spacing:.01em;
    cursor:pointer;
    touch-action:manipulation;
    transition:background .14s var(--ease), transform .12s var(--ease);
  }
  button:active{transform:translateY(1px);}
  button:hover{background:#E3EB85;}
  button:focus-visible{outline:2px solid var(--line);outline-offset:2px;}
  button:disabled{background:rgba(215,224,91,.25);color:rgba(22,33,29,.5);cursor:not-allowed;}

  .actions{display:flex;gap:8px;margin-bottom:22px;}
  .link-btn{
    flex:1 1 0;
    background:transparent;
    border:1px solid rgba(244,241,232,.16);
    color:rgba(244,241,232,.72);
    font-family:'Archivo',sans-serif;
    font-weight:600;
    font-size:12.5px;
    letter-spacing:.01em;
    padding:11px 8px;
    border-radius:9px;
    text-decoration:none;
  }
  .link-btn:hover{color:var(--line);background:rgba(244,241,232,.06);border-color:rgba(244,241,232,.3);}

  /* ---------- court map ---------- */
  .grid{display:flex;flex-direction:column;gap:9px;margin-top:4px;}
  .court{
    display:grid;
    grid-template-columns:44px 1fr;
    align-items:stretch;
    gap:10px;
  }
  .court-no{
    font-family:'Archivo Black',sans-serif;
    font-size:19px;
    color:rgba(244,241,232,.55);
    display:flex;align-items:center;justify-content:flex-end;
    letter-spacing:-0.01em;
  }
  .court.full .court-no{color:var(--clay);}
  .court-sides{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:var(--court);
    border:1px solid rgba(244,241,232,.14);
    border-radius:10px;
    overflow:hidden;
    /* the net */
    column-gap:2px;
    background-image:linear-gradient(var(--line),var(--line));
    background-size:2px 100%;
    background-position:center;
    background-repeat:no-repeat;
  }
  .side{
    position:relative;
    padding:11px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    background:var(--court);
    overflow:hidden;
  }
  /* Fill rises from the baseline as the side takes players. */
  .side::before{
    content:"";
    position:absolute;left:0;right:0;bottom:0;
    height:calc(var(--fill,0) * 100%);
    background:rgba(215,224,91,.17);
    transition:height .4s var(--ease);
  }
  .side-name{
    position:relative;
    font-family:'Archivo Black',sans-serif;
    font-size:14px;
    letter-spacing:.02em;
  }
  .side-count{
    position:relative;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    color:rgba(244,241,232,.52);
  }
  .side.full .side-name{color:var(--ball);}
  .side.full .side-count{color:var(--ball);}

  .full-note{
    text-align:center;
    color:var(--clay);
    font-size:13px;
    margin-top:16px;
    font-weight:700;
    display:none;
  }

  /* ---------- setup ---------- */
  .setup-card{
    background:var(--court);
    border:1px solid rgba(244,241,232,.14);
    border-radius:var(--r);
    padding:24px 20px;
  }
  label{
    font-size:11px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;
    color:rgba(244,241,232,.62);
    margin-bottom:9px;
    display:block;
  }
  input[type="number"]{
    width:100%;
    background:var(--deep);
    border:1px solid rgba(244,241,232,.16);
    border-radius:10px;
    color:var(--line);
    font-family:'Archivo Black',sans-serif;
    font-size:30px;
    text-align:center;
    padding:15px;
    margin-bottom:14px;
  }
  input[type="number"]::placeholder{color:rgba(244,241,232,.38);}
  input[type="number"]:focus{outline:2px solid var(--ball);outline-offset:1px;}
  /* Court picker: six toggles, because which courts are free changes week
     to week and the old build had 13-16 hard-coded. */
  /* Six fixed columns, so the chips always read as the court numbers in
     order rather than reflowing into a ragged last row. */
  .court-picker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:8px;}
  .court-chip{
    padding:15px 2px;
    border-radius:10px;
    border:1px solid rgba(244,241,232,.2);
    background:var(--deep);
    color:rgba(244,241,232,.72);
    font-family:'Archivo Black',sans-serif;
    font-size:17px;
    line-height:1;
    cursor:pointer;
    touch-action:manipulation;
    transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
  }
  .court-chip:hover{border-color:rgba(244,241,232,.45);color:var(--line);}
  .court-chip[aria-pressed="true"]{background:var(--ball);border-color:var(--ball);color:var(--ink);}
  .court-chip:focus-visible{outline:2px solid var(--ball);outline-offset:2px;}
  .picker-note{
    font-size:12px;
    color:rgba(244,241,232,.5);
    text-align:center;
    margin:0 0 18px;
    min-height:16px;
  }
  .picker-note.warn{color:#F0B4A0;}

  .setup-note{
    font-size:12.5px;
    color:rgba(244,241,232,.55);
    text-align:center;
    margin-top:12px;
    line-height:1.55;
  }

  .hidden{display:none !important;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../../"><span class="back-arrow">&lsaquo;</span>Shelf</a>
  <header>
    <h1>Court Allocator</h1>
    <p class="sub" id="headerSub">Tap for a random spot</p>
  </header>

  <div class="setup-card" id="setupCard">
    <label id="courtsLabel">Which courts today?</label>
    <div class="court-picker" id="courtPicker" role="group" aria-labelledby="courtsLabel"></div>
    <p class="picker-note" id="pickerNote"></p>

    <label for="playerCount">How many players today?</label>
    <input type="number" id="playerCount" min="4" max="16" step="1" placeholder="e.g. 10" inputmode="numeric">
    <button id="startBtn">Set courts</button>
    <p class="setup-note" id="setupNote">Up to 4 players per court, two a side.</p>
  </div>

  <div id="playArea" class="hidden">
    <div class="result-card" id="resultCard" role="button" tabindex="0" aria-label="Tap to get your court">
      <div class="result-label">Your spot</div>
      <strong class="result-value" id="resultValue">TAP</strong>
      <div class="result-sub" id="resultSub">Tap this card to get your court</div>
    </div>

    <div class="actions">
      <button class="link-btn" id="resetBtn">Reset courts</button>
      <button class="link-btn" id="changeBtn">Change setup</button>
    </div>

    <div class="grid" id="grid"></div>
    <div class="full-note" id="fullNote">All courts are full for this round.</div>
  </div>
</div>

<script>
  try {
    const AVAILABLE_COURTS = [13, 14, 15, 16, 17, 18]; // every court the club can give us
    const SIDES = ['A', 'B'];
    const CAPACITY = 2; // players per side, per court
    const PER_COURT = CAPACITY * SIDES.length;
    const STORE = 'courtAllocator:courts';

    let COURTS = [];       // the courts actually in play this session
    let slots = {};
    let selectedCourts = loadCourts();   // the pool picked on the setup screen

    const headerSub = document.getElementById('headerSub');
    const setupCard = document.getElementById('setupCard');
    const setupNote = document.getElementById('setupNote');
    const playerCountInput = document.getElementById('playerCount');
    const startBtn = document.getElementById('startBtn');
    const playArea = document.getElementById('playArea');
    const changeBtn = document.getElementById('changeBtn');

    const resultCard = document.getElementById('resultCard');
    const resultValue = document.getElementById('resultValue');
    const resultSub = document.getElementById('resultSub');
    const resetBtn = document.getElementById('resetBtn');
    const grid = document.getElementById('grid');
    const fullNote = document.getElementById('fullNote');
    const courtPicker = document.getElementById('courtPicker');
    const pickerNote = document.getElementById('pickerNote');

    /* The pool is remembered between visits: which courts are free tends to be
       the same for weeks at a time, so re-picking every session is busywork. */
    function loadCourts(){
      try {
        const raw = localStorage.getItem(STORE);
        const arr = raw ? JSON.parse(raw) : null;
        const clean = Array.isArray(arr) ? arr.filter(c => AVAILABLE_COURTS.indexOf(c) !== -1) : [];
        if (clean.length) return clean.sort((a, b) => a - b);
      } catch(e){ /* blocked or corrupt storage: fall through to the default */ }
      return [13, 14, 15, 16];
    }
    function saveCourts(){
      try { localStorage.setItem(STORE, JSON.stringify(selectedCourts)); } catch(e){}
    }

    function renderPicker(){
      courtPicker.innerHTML = '';
      AVAILABLE_COURTS.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'court-chip';
        btn.textContent = c;
        btn.setAttribute('aria-pressed', selectedCourts.indexOf(c) !== -1 ? 'true' : 'false');
        btn.setAttribute('aria-label', 'Court ' + c);
        btn.addEventListener('click', () => toggleCourt(c));
        courtPicker.appendChild(btn);
      });
      updatePickerNote();
    }

    function toggleCourt(c){
      const i = selectedCourts.indexOf(c);
      if (i === -1) selectedCourts.push(c); else selectedCourts.splice(i, 1);
      selectedCourts.sort((a, b) => a - b);
      saveCourts();
      renderPicker();
    }

    function courtListLabel(list){
      if (!list.length) return '';
      if (list.length === 1) return String(list[0]);
      return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
    }

    function updatePickerNote(){
      const n = selectedCourts.length;
      pickerNote.classList.toggle('warn', n === 0);
      pickerNote.textContent = n
        ? n + ' court' + (n > 1 ? 's' : '') + ' selected, room for ' + (n * PER_COURT) + ' players.'
        : 'Pick at least one court.';
    }

    function courtsNeeded(count){
      const needed = Math.ceil(count / PER_COURT); // 4 players per full court
      return Math.min(selectedCourts.length, Math.max(1, needed));
    }

    function setupCourts(count){
      clearTimeout(revertTimer);
      const n = courtsNeeded(count);
      // Lowest-numbered picked courts first, so a short night fills from one
      // end of the pool rather than an arbitrary order.
      COURTS = selectedCourts.slice(0, n);
      slots = {};
      COURTS.forEach(c => SIDES.forEach(s => slots[c + s] = 0));

      const label = courtListLabel(COURTS);
      const spots = COURTS.length * PER_COURT;
      const over = count - spots;
      headerSub.textContent =
        `Tap for a random spot. Court${COURTS.length > 1 ? 's' : ''} ${label}.` +
        (over > 0 ? ` ${spots} spots for ${count} players, so ${over} will be waiting.` : '');

      resultValue.textContent = 'TAP';
      resultSub.textContent = 'Tap this card to get your court';

      setupCard.classList.add('hidden');
      playArea.classList.remove('hidden');

      renderGrid();
    }

    // One row per court, each split at the net into its two sides. Each side
    // fills from the baseline up as it takes players, so the whole session is
    // readable at a glance from across the court.
    function renderGrid(){
      grid.innerHTML = '';
      COURTS.forEach(c => {
        const courtFull = SIDES.every(s => slots[c + s] >= CAPACITY);
        const row = document.createElement('div');
        row.className = 'court' + (courtFull ? ' full' : '');
        row.innerHTML = `
          <div class="court-no">${c}</div>
          <div class="court-sides">
            ${SIDES.map(s => {
              const count = slots[c + s];
              const full = count >= CAPACITY;
              return `<div class="side${full ? ' full' : ''}" style="--fill:${count / CAPACITY}">
                <span class="side-name">${s}</span>
                <span class="side-count">${count}/${CAPACITY}</span>
              </div>`;
            }).join('')}
          </div>
        `;
        grid.appendChild(row);
      });

      const allFull = Object.values(slots).every(v => v >= CAPACITY);
      if(allFull){
        resultCard.classList.add('disabled');
        resultCard.setAttribute('aria-disabled', 'true');
      } else {
        resultCard.classList.remove('disabled');
        resultCard.removeAttribute('aria-disabled');
      }
      fullNote.style.display = allFull ? 'block' : 'none';
    }

    let revertTimer = null;
    const REVERT_DELAY = 2200; // ms before the card resets to "TAP" for the next person

    function assign(){
      const available = Object.keys(slots).filter(k => slots[k] < CAPACITY);
      if(available.length === 0) return;

      clearTimeout(revertTimer);

      const pick = available[Math.floor(Math.random() * available.length)];
      slots[pick]++;

      resultValue.textContent = pick;
      resultValue.classList.remove('pop');
      void resultValue.offsetWidth;
      resultValue.classList.add('pop');

      const court = pick.slice(0, -1);
      const side = pick.slice(-1);
      resultSub.textContent = `Court ${court}, side ${side}. Go grab a spot.`;

      renderGrid();

      revertTimer = setTimeout(() => {
        const stillAvailable = Object.keys(slots).some(k => slots[k] < CAPACITY);
        resultValue.textContent = 'TAP';
        resultSub.textContent = stillAvailable
          ? 'Next player, tap this card'
          : 'All courts are full';
      }, REVERT_DELAY);
    }

    function reset(){
      clearTimeout(revertTimer);
      COURTS.forEach(c => SIDES.forEach(s => slots[c + s] = 0));
      resultValue.textContent = 'TAP';
      resultSub.textContent = 'Tap this card to get your court';
      renderGrid();
    }

    function backToSetup(){
      clearTimeout(revertTimer);
      playArea.classList.add('hidden');
      setupCard.classList.remove('hidden');
      headerSub.textContent = 'Tap for a random spot';
      renderPicker();
    }

    startBtn.addEventListener('click', () => {
      if (!selectedCourts.length){
        setupNote.textContent = 'Pick at least one court before you start.';
        setupNote.style.color = '#F0B4A0';
        return;
      }
      const raw = parseInt(playerCountInput.value, 10);
      if(!raw || raw < 1){
        setupNote.textContent = 'Enter how many players are here today.';
        setupNote.style.color = '#F0B4A0';
        return;
      }
      setupNote.style.color = '';
      setupNote.textContent = 'Up to 4 players per court, two a side.';
      setupCourts(raw);
    });

    renderPicker();

    playerCountInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') startBtn.click();
    });

    resultCard.addEventListener('click', assign);
    resultCard.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        assign();
      }
    });
    resetBtn.addEventListener('click', reset);
    changeBtn.addEventListener('click', backToSetup);
  } catch(e) {
    console.error('Court allocator error:', e);
  }
</script>
</body>
</html>
