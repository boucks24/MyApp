<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5/3/1 BBB">
<title>5/3/1 BBB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15161A;
    --panel:#1E2024;
    --panel-2:#25272C;
    --line:#33363B;
    --chalk:#ECE8E1;
    --muted:#8B8D93;
    --iron:#C1442B;      /* 25kg plate red - deadlift */
    --steel:#2E6FA7;     /* 20kg plate blue - squat */
    --brass:#C79A2E;     /* 15kg plate yellow - bench */
    --moss:#4F8B4A;      /* 10kg plate green - press */
    --good:#5FA85A;
    --font-display:'Oswald', system-ui, -apple-system, sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--chalk);font-family:var(--font-body);}
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
    overscroll-behavior-y:none;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  header.topbar{
    display:flex;align-items:center;gap:12px;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header.topbar .back{
    width:34px;height:34px;border-radius:0;border:1px solid var(--line);
    background:var(--panel);color:var(--chalk);font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    text-decoration:none;
  }
  header.topbar h1{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:0.02em;margin:0;flex:1;}
  header.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}

  main{flex:1;padding:18px 20px 110px;}

  .toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--line);color:var(--chalk);
    padding:12px 18px;font-size:13px;z-index:50;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }

  /* ---- Cards / generic ---- */
  .card{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:14px;}
  .card h2{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 12px;letter-spacing:0.01em;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .label{color:var(--muted);font-size:13px;}
  .row .value{font-family:var(--font-display);font-size:16px;font-weight:600;}

  label.field{display:block;margin-bottom:14px;}
  label.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input[type=number], input[type=date], select{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--chalk);
    padding:12px 12px;font-size:16px;font-family:var(--font-body);
  }
  input[type=number]:focus, input[type=date]:focus, select:focus{outline:1px solid var(--steel);}
  input[type=file]{display:none;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--iron);color:#fff;border:none;
    padding:14px 18px;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:0.02em;
    width:100%;cursor:pointer;
  }
  .btn:active{opacity:0.85;}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--chalk);}
  .btn.ghost{background:transparent;border:none;color:var(--muted);font-family:var(--font-body);font-weight:500;font-size:13px;padding:10px;}
  .btn.danger{background:transparent;border:1px solid var(--iron);color:var(--iron);}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn-row .btn{flex:1;}

  /* ---- Lift identity ---- */
  .plate{width:10px;height:34px;border-radius:2px;flex-shrink:0;}
  .plate.squat{background:var(--steel);}
  .plate.bench{background:var(--brass);}
  .plate.deadlift{background:var(--iron);}
  .plate.press{background:var(--moss);}
  .plate-mini{width:8px;height:20px;margin:0 auto;}

  .cp-grid{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .cp-row{display:grid;grid-template-columns:28px repeat(4,1fr);gap:6px;align-items:stretch;}
  .cp-wk{font-size:11px;color:var(--muted);font-family:var(--font-display);font-weight:600;align-self:center;}
  .cp-cell{
    min-height:48px;border:1px solid var(--line);background:var(--panel-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:14px;color:var(--muted);
    font-family:var(--font-body);padding:4px 2px;margin:0;cursor:pointer;
    touch-action:manipulation;
  }
  .cp-cell.cp-head{background:transparent;border:none;min-height:auto;cursor:default;}
  .cp-cell.cp-done{background:var(--good);border-color:var(--good);color:#0d1a0c;}
  .cp-cell.cp-current{border-color:var(--iron);box-shadow:0 0 0 1px var(--iron) inset;}
  .cp-weight{font-family:var(--font-display);font-size:13px;font-weight:700;line-height:1.1;}
  .cp-reps{font-size:9.5px;line-height:1.1;opacity:0.85;}
  .cp-next{font-size:10px;font-weight:700;letter-spacing:0.02em;color:var(--iron);}
  .cp-cell.cp-done .cp-next{color:#0d1a0c;}
  .cp-empty{font-size:14px;color:var(--muted);}

  .cp-icon{
    width:30px;height:30px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:0.02em;
    color:#fff;
  }
  .cp-icon.squat{background:var(--steel);}
  .cp-icon.bench{background:var(--brass);color:#241c06;}
  .cp-icon.deadlift{background:var(--iron);}
  .cp-icon.press{background:var(--moss);}

  .cp-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
  .cp-toolbar h2{margin:0;}
  .cp-navbtn, .cp-gear{
    width:30px;height:30px;flex-shrink:0;border:1px solid var(--line);background:var(--panel-2);
    color:var(--chalk);font-size:16px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-family:var(--font-body);
  }
  .cp-navbtn:disabled{opacity:0.3;cursor:default;}
  .cp-gear{margin-left:auto;font-size:15px;}

  .lift-filter-row{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap;}
  .lift-chip{
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-family:var(--font-body);font-size:12px;font-weight:600;padding:7px 12px;cursor:pointer;
  }
  .lift-chip.active{background:var(--iron);border-color:var(--iron);color:#fff;}

  .history-group{margin-bottom:6px;}
  .history-group .hg-title{
    font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:0.02em;
    color:var(--muted);text-transform:uppercase;padding:16px 0 4px;
  }
  .history-group:first-child .hg-title{padding-top:0;}

  .pd-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .pd-lift-row{
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--chalk);
    padding:10px 14px;font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;
  }
  .pd-lift-row.selected{border-color:var(--iron);box-shadow:0 0 0 1px var(--iron) inset;}
  .pd-weeks{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .pd-week-row{
    border:1px solid var(--line);background:var(--panel-2);color:var(--chalk);
    padding:12px 14px;font-family:var(--font-display);font-size:14px;font-weight:600;text-align:left;cursor:pointer;
  }
  .pd-week-row.selected{background:var(--iron);border-color:var(--iron);color:#fff;}

  .lift-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .lift-head .name{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:0.01em;}
  .lift-head .meta{color:var(--muted);font-size:12px;}

  .set-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .set-row:last-child{border-bottom:none;}
  .set-row .set-left{display:flex;flex-direction:column;}
  .set-row .pct{font-size:12px;color:var(--muted);}
  .set-row .weight{font-family:var(--font-display);font-size:22px;font-weight:600;}
  .set-row .target{font-size:12px;color:var(--muted);margin-top:2px;}
  .set-row .plate-line{font-size:11.5px;color:var(--steel);margin-top:6px;font-weight:600;}
  .set-row .last-time{font-size:11px;color:var(--muted);margin-top:3px;font-style:italic;}
  .plate-line{font-size:11.5px;color:var(--steel);margin-top:8px;font-weight:600;}
  .last-time{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic;}
  .set-row input.reps{
    width:56px;text-align:center;background:var(--panel-2);border:1px solid var(--line);
    color:var(--chalk);padding:10px 4px;font-size:16px;font-family:var(--font-display);
  }
  .set-right{display:flex;flex-direction:row;align-items:center;gap:10px;flex-shrink:0;}
  .done-tick{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--line);background:var(--panel-2);color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:700;line-height:1;cursor:pointer;touch-action:manipulation;
    transition:background-color .15s,border-color .15s,color .15s;
  }
  .done-tick.done{background:rgba(95,168,90,0.18);border-color:var(--good);color:var(--good);}

  .rest-timer{
    position:fixed;left:0;right:0;bottom:0;
    max-width:560px;margin:0 auto;
    background:var(--steel);color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    z-index:30;
  }
  .rest-timer.hidden{display:none;}
  .rest-timer .rt-label{font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;opacity:0.85;}
  .rest-timer .rt-time{font-family:var(--font-display);font-size:24px;font-weight:600;flex:1;}
  .rest-timer .rt-skip{
    background:rgba(255,255,255,0.18);border:none;color:#fff;
    padding:9px 16px;font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;
  }

  .weight-edit{display:flex;align-items:baseline;gap:5px;}
  .weight-edit input, .bbb-weight-edit input{
    font-family:var(--font-display);font-weight:600;color:var(--chalk);
    background:transparent;border:none;border-bottom:1px dashed var(--muted);
    padding:2px 0;-webkit-appearance:none;appearance:none;
  }
  .weight-edit input{font-size:22px;width:88px;}
  .bbb-weight-edit input{font-size:16px;width:70px;text-align:right;}
  .weight-edit input:focus, .bbb-weight-edit input:focus{outline:none;border-bottom-color:var(--steel);}
  .weight-edit .unit{font-size:12px;color:var(--muted);}

  .bbb-counter{display:flex;gap:8px;margin-top:10px;}
  .bbb-dot{
    flex:1;height:40px;border:1px solid var(--line);background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-size:14px;color:var(--muted);cursor:pointer;
  }
  .bbb-dot.done{background:var(--good);border-color:var(--good);color:#0d1a0c;}

  /* ---- Bottom nav ---- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;
    max-width:560px;margin:0 auto;
    background:var(--panel);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);
    z-index:20;
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--muted);
    font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:0.02em;
    padding:12px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  nav.tabs button .ic{width:18px;height:18px;border:1.5px solid var(--muted);}
  nav.tabs button.active{color:var(--chalk);}
  nav.tabs button.active .ic{border-color:var(--iron);background:var(--iron);}

  .history-item{border-bottom:1px solid var(--line);padding:14px 0;}
  .history-item:last-child{border-bottom:none;}
  .history-item .hi-top{display:flex;justify-content:space-between;align-items:baseline;}
  .history-item .hi-lift{font-family:var(--font-display);font-weight:600;font-size:15px;}
  .history-item .hi-date{font-size:11px;color:var(--muted);}
  .history-item .hi-detail{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .history-item .hi-pr{color:var(--good);font-weight:600;}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty .big{font-family:var(--font-display);font-size:40px;color:var(--line);margin-bottom:10px;}

  .modal-back{
    position:fixed;inset:0;background:rgba(10,10,10,0.7);z-index:60;
    display:flex;align-items:flex-end;
  }
  .modal{background:var(--panel);border-top:1px solid var(--line);width:100%;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
  .modal h2{font-family:var(--font-display);font-size:18px;margin:0 0 6px;}
  .modal p.desc{color:var(--muted);font-size:13px;margin:0 0 16px;}

  .subtabs{display:flex;gap:8px;padding:16px 20px 0;}
  .subtab{flex:1;text-align:center;padding:10px 0;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:0.02em;cursor:pointer;}
  .subtab.active{background:var(--iron);border-color:var(--iron);color:#fff;}

  .chart-card{margin-bottom:14px;}
  .chart-empty{color:var(--muted);font-size:12px;padding:8px 0 2px;line-height:1.5;}
  .chart-latest{font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:6px;}
  .chart-latest .u{color:var(--muted);font-size:11px;font-family:var(--font-body);font-weight:500;margin-left:6px;}

  label.btn{margin:0;text-align:center;}

  .sync-banner{
    background:var(--panel-2);border:1px solid var(--steel);
    margin:0 20px 16px;padding:14px 16px;
  }
  .sync-banner .sb-title{font-family:var(--font-display);font-size:14px;font-weight:600;margin-bottom:4px;}
  .sync-banner .sb-desc{color:var(--muted);font-size:12px;margin-bottom:12px;line-height:1.5;}

  ::selection{background:var(--iron);color:#fff;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------------- storage helpers ---------------- */
  const SKEY = '531_settings', HKEY = '531_history', TKEY = '531_state';

  function load(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function save(key, val){
    localStorage.setItem(key, JSON.stringify(val));
    localStorage.setItem('531_updatedAt', new Date().toISOString());
  }

  function defaultSettings(){
    return {
      unit:'kg',
      increment:2.5,
      bbbPercent:50,
      barWeight:20,
      order:['press','deadlift','bench','squat'],
      tms:{ squat:95, bench:97.5, deadlift:135, press:57.5 }
    };
  }
  function defaultState(){ return { cycle:1, week:1, dayIndex:0 }; }

  let settings = load(SKEY, defaultSettings());
  let history  = load(HKEY, []);
  let state    = load(TKEY, defaultState());

  const LIFT_LABEL = { squat:'Squat', bench:'Bench Press', deadlift:'Deadlift', press:'Overhead Press' };
  const LIFT_CLASS = { squat:'squat', bench:'bench', deadlift:'deadlift', press:'press' };
  const LIFT_ABBR = { squat:'SQ', bench:'BP', deadlift:'DL', press:'OH' };
  const PLATES_KG = [25, 20, 15, 10, 5, 2.5, 1.25];
  const PLATES_LB = [45, 35, 25, 10, 5, 2.5];

  const WEEK_SCHEME = {
    1:{ label:'5s',    pct:[65,75,85],  reps:['5','5','5+'] },
    2:{ label:'3s',    pct:[70,80,90],  reps:['3','3','3+'] },
    3:{ label:'5/3/1', pct:[75,85,95],  reps:['5','3','1+'] }
  };
  const ALT_LIFT = { squat:'deadlift', deadlift:'squat', bench:'press', press:'bench' };
  const CYCLE_BUMP = { squat:5, deadlift:5, bench:2.5, press:2.5 }; // kg defaults
  const CYCLE_BUMP_LB = { squat:10, deadlift:10, bench:5, press:5 };
  const WARMUP_SCHEME = [ { pct:40, reps:5 }, { pct:50, reps:5 }, { pct:60, reps:3 } ];
  const REST_WARMUP = 45, REST_MAIN = 120, REST_BBB = 75; // seconds

  function round(w){
    const inc = settings.increment || 2.5;
    return Math.round(w / inc) * inc;
  }
  function fmtW(w){
    if (w === null || w === undefined || isNaN(w)) return '—';
    const n = Math.round(w * 100) / 100;
    return (n % 1 === 0 ? n.toFixed(0) : n.toFixed(1)) + settings.unit;
  }
  function epley(weight, reps){
    if (!reps || reps <= 0) return null;
    return weight * (1 + reps/30);
  }

  function hasTMs(){
    return settings.tms.squat && settings.tms.bench && settings.tms.deadlift && settings.tms.press;
  }

  function currentLift(){ return settings.order[state.dayIndex]; }

  function computeWorkout(){
    const lift = currentLift();
    const tm = settings.tms[lift];
    const scheme = WEEK_SCHEME[state.week];
    const warmupSets = WARMUP_SCHEME.map(ws => ({ pct: ws.pct, reps: ws.reps, weight: round(tm * ws.pct / 100) }));
    const mainSets = scheme.pct.map((p,i)=>({
      pct:p, repsLabel:scheme.reps[i], weight: round(tm * p / 100), amrap: scheme.reps[i].includes('+')
    }));
    const bbbLift = ALT_LIFT[lift];
    const bbbWeight = round(settings.tms[bbbLift] * settings.bbbPercent / 100);
    return { lift, tm, scheme, warmupSets, mainSets, bbbLift, bbbWeight };
  }

  /* ---------------- plate math ---------------- */
  function barWeight(){
    if (settings.barWeight) return settings.barWeight;
    return settings.unit === 'kg' ? 20 : 45;
  }

  function plateDenoms(){
    return settings.unit === 'kg' ? PLATES_KG : PLATES_LB;
  }

  // Greedy per-side plate breakdown for a given total bar weight. Works in
  // quarter-kg units to avoid floating-point drift.
  function plateBreakdown(totalWeight){
    const bar = barWeight();
    const perSide = Math.max(0, (totalWeight - bar) / 2);
    const denoms = plateDenoms();
    const counts = {};
    let remaining = Math.round(perSide * 4);
    denoms.forEach(p => {
      const pq = Math.round(p * 4);
      const n = Math.floor(remaining / pq);
      if (n > 0){ counts[p] = n; remaining -= n * pq; }
    });
    return counts;
  }

  function diffPlateCounts(prev, next){
    const add = {}, remove = {};
    const keys = new Set([...Object.keys(prev || {}), ...Object.keys(next || {})]);
    keys.forEach(k => {
      const before = (prev && prev[k]) || 0;
      const after = (next && next[k]) || 0;
      if (after > before) add[k] = after - before;
      else if (before > after) remove[k] = before - after;
    });
    return { add, remove };
  }

  // Walks a session's stage weights in order and returns the plates to load
  // at each stage. When weight goes up, plates are only ever ADDED on top of
  // whatever's already loaded (never swapped out). When weight drops (e.g.
  // stepping down into BBB), it falls back to a fresh minimal breakdown and
  // reports only the actual difference to remove.
  function buildSessionPlateStages(weights){
    const denoms = plateDenoms();
    const bigDenoms = denoms.filter(p => p >= 10);     // never removed once loaded
    const smallDenoms = denoms.filter(p => p < 10);    // 5, 2.5, 1.25 — fine to pull off

    let current = {};   // plate size -> count currently loaded, per side
    let currentQ = 0;    // current per-side weight in quarter-kg units

    return weights.map(w => {
      const targetQ = Math.round(Math.max(0, (w - barWeight()) / 2) * 4);
      const deltaQ = targetQ - currentQ;
      let add = {}, remove = {};

      if (deltaQ >= 0){
        let remaining = deltaQ;
        denoms.forEach(p => {
          const pq = Math.round(p * 4);
          const n = Math.floor(remaining / pq);
          if (n > 0){
            add[p] = (add[p] || 0) + n;
            current[p] = (current[p] || 0) + n;
            remaining -= n * pq;
          }
        });
      } else {
        const bigTotalQ = bigDenoms.reduce((sum,p) => sum + (current[p]||0) * Math.round(p*4), 0);
        let fresh;

        if (targetQ >= bigTotalQ){
          // Keep every 10kg+ plate exactly as loaded — only adjust 5/2.5/1.25.
          let remaining = targetQ - bigTotalQ;
          const freshSmall = {};
          smallDenoms.forEach(p => {
            const pq = Math.round(p * 4);
            const n = Math.floor(remaining / pq);
            if (n > 0){ freshSmall[p] = n; remaining -= n * pq; }
          });
          fresh = {};
          bigDenoms.forEach(p => { if (current[p]) fresh[p] = current[p]; });
          Object.keys(freshSmall).forEach(p => { fresh[p] = freshSmall[p]; });
        } else {
          // Target is lighter than the big plates alone — a big plate has to
          // come off too; no way to hit this one without it.
          fresh = {};
          let remaining = targetQ;
          denoms.forEach(p => {
            const pq = Math.round(p * 4);
            const n = Math.floor(remaining / pq);
            if (n > 0){ fresh[p] = n; remaining -= n * pq; }
          });
        }

        const d = diffPlateCounts(current, fresh);
        add = d.add; remove = d.remove;
        current = fresh;
      }

      currentQ = targetQ;
      return { add, remove, total: Object.assign({}, current) };
    });
  }

  function formatPlateCounts(counts){
    const keys = Object.keys(counts).map(Number).sort((a,b) => b - a);
    if (!keys.length) return '';
    return keys.map(k => `${counts[k]}×${k}`).join(', ') + settings.unit;
  }

  function formatPlateStage(stage){
    const addStr = formatPlateCounts(stage.add);
    const removeStr = formatPlateCounts(stage.remove);
    if (!addStr && !removeStr){
      return Object.keys(stage.total || {}).length ? 'No change' : 'Bar only';
    }
    const parts = [];
    if (addStr) parts.push(`+ ${addStr}`);
    if (removeStr) parts.push(`− ${removeStr}`);
    return parts.join('&nbsp;&nbsp;·&nbsp;&nbsp;');
  }

  /* ---------------- last time recall ---------------- */
  function lastTimeForSet(lift, week, setIndex){
    const matches = history
      .filter(h => h.lift === lift && h.week === week && h.mainSets[setIndex])
      .sort((a,b) => a.date.localeCompare(b.date));
    if (!matches.length) return null;
    const h = matches[matches.length - 1];
    const s = h.mainSets[setIndex];
    return { weight: s.weight, reps: s.actualReps ?? null, repsLabel: s.repsLabel };
  }

  function lastTimeForBBB(bbbLift){
    const matches = history
      .filter(h => h.bbbLift === bbbLift && h.bbbWeight != null)
      .sort((a,b) => a.date.localeCompare(b.date));
    if (!matches.length) return null;
    const h = matches[matches.length - 1];
    return { weight: h.bbbWeight, sets: h.bbbSets };
  }

  /* ---------------- navigation state ---------------- */
  let route = '531home'; // 531home | setup | train | history
  let toastTimer = null;
  let bbbDone = 0;
  let repsInput = {};
  let pendingCycleUp = null; // {tms:{...}} while modal shown
  let historyTab = 'log'; // log | progress
  let historyLiftFilter = 'all'; // 'all' | lift key
  let editingHistoryIdx = null;
  let pendingStaleReminder = null; // {exportedAt, days} when the committed backup file is over a month old
  let sessionWeights = null; // {main:[w,w,w], bbb:w} — editable overrides for the in-progress workout
  let warmupDone = [false, false, false];
  let mainDone = [false, false, false];
  let restEndsAt = null; // ms epoch when the current rest countdown ends, or null if not resting
  let viewingCycle = state.cycle; // which cycle the Home progress grid is paged to
  let pendingPickDay = null; // {dayIndex, week} while the "choose a different day" modal is open
  let pendingCycleTMEdit = null; // {squat,bench,deadlift,press} while the TM-edit modal is open
  let pendingStartCycleConfirm = null; // true while the "start new cycle" confirmation modal is open
  let pendingDiscardConfirm = null; // route to go to while the "discard workout" confirmation modal is open

  function go(r){
    route = r; bbbDone = 0; repsInput = {}; sessionWeights = null;
    warmupDone = [false, false, false]; mainDone = [false, false, false];
    if (r === '531home') viewingCycle = state.cycle;
    stopRest();
    render(); window.scrollTo(0,0);
  }

  /* ---------------- rest timer ----------------
     A single global ticker (started once, never re-created) repaints the
     countdown by id every tick — a full render() every 250ms would thrash
     the whole page and steal focus, so the ticking display bypasses it and
     only patches the two text nodes directly. render() itself still owns
     showing/hiding the timer (based on restEndsAt) whenever something else
     causes a re-render anyway. */
  function startRest(seconds){
    restEndsAt = Date.now() + seconds * 1000;
    updateRestTimerUI();
  }
  function stopRest(){
    restEndsAt = null;
    updateRestTimerUI();
  }
  // Also used directly by renderTrain() so a freshly-rendered timer shows the
  // real remaining time immediately, rather than a placeholder until the
  // next tick of the global ticker below.
  function restLabelText(){
    if (!restEndsAt) return '0:00';
    const s = Math.max(0, Math.ceil((restEndsAt - Date.now()) / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function updateRestTimerUI(){
    const el = document.getElementById('restTimer');
    if (!el) return; // not on Train right now
    if (!restEndsAt){ el.classList.add('hidden'); return; }
    const remainingMs = restEndsAt - Date.now();
    if (remainingMs <= 0){
      restEndsAt = null;
      el.classList.add('hidden');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      return;
    }
    el.classList.remove('hidden');
    const label = document.getElementById('restTimerLabel');
    if (label) label.textContent = restLabelText();
  }
  setInterval(updateRestTimerUI, 250);

  // Lazily seeds the editable weights for the current Train session from the
  // computed prescription, so edits survive re-renders (e.g. after changing
  // another field) without recomputing from training max each time.
  function ensureSessionWeights(w){
    if (!sessionWeights){
      sessionWeights = { main: w.mainSets.map(s => s.weight), bbb: w.bbbWeight };
    }
    return sessionWeights;
  }

  function showToast(msg){
    clearTimeout(toastTimer);
    let t = document.querySelector('.toast');
    if (!t){ t = document.createElement('div'); t.className='toast'; document.getElementById('app').appendChild(t); }
    t.textContent = msg;
    toastTimer = setTimeout(()=>{ t.remove(); }, 1800);
  }

  /* ---------------- render ---------------- */
  function render(){
    const app = document.getElementById('app');
    let html = '';
    if (route === 'setup') html = renderSetup();
    else if (route === '531home') html = renderHome();
    else if (route === 'train') html = renderTrain();
    else if (route === 'history') html = renderHistory();
    app.innerHTML = html;
    if (pendingCycleUp) app.insertAdjacentHTML('beforeend', renderCycleModal());
    if (editingHistoryIdx !== null) app.insertAdjacentHTML('beforeend', renderEditHistoryModal());
    if (pendingPickDay) app.insertAdjacentHTML('beforeend', renderPickDayModal());
    if (pendingCycleTMEdit) app.insertAdjacentHTML('beforeend', renderCycleTMEditModal());
    if (pendingStartCycleConfirm) app.insertAdjacentHTML('beforeend', renderStartCycleConfirmModal());
    if (pendingDiscardConfirm) app.insertAdjacentHTML('beforeend', renderDiscardConfirmModal());
    bindEvents();
  }

  function syncBanner(){
    if (!pendingStaleReminder) return '';
    const d = new Date(pendingStaleReminder.exportedAt);
    const when = isNaN(d) ? pendingStaleReminder.exportedAt : d.toLocaleDateString();
    return `
      <div class="sync-banner">
        <div class="sb-title">Backup is ${pendingStaleReminder.days} days old</div>
        <div class="sb-desc">The history.json in your repo was last exported on ${when}. Export a fresh copy and upload it to keep it current.</div>
        <div class="btn-row">
          <button class="btn secondary" data-action="dismissStaleReminder">Remind me later</button>
          <button class="btn" data-action="exportFromReminder">Export now</button>
        </div>
      </div>
    `;
  }

  function topbar(title, sub, backHref, backRoute, confirmDiscard){
    const back = backRoute
      ? `<div class="back" data-action="${confirmDiscard ? 'backDiscardConfirm' : 'go'}" data-route="${backRoute}">‹</div>`
      : (backHref ? `<a class="back" href="${backHref}">‹</a>` : '');
    return `
      <header class="topbar">
        ${back}
        <div>
          <h1>${title}</h1>
          ${sub ? `<div class="sub">${sub}</div>` : ''}
        </div>
      </header>
    `;
  }

  function tabs(active){
    return `
      <nav class="tabs">
        <button data-action="go" data-route="531home" class="${active==='531home'?'active':''}"><span class="ic"></span>Train</button>
        <button data-action="go" data-route="history" class="${active==='history'?'active':''}"><span class="ic"></span>History</button>
        <button data-action="go" data-route="setup" class="${active==='setup'?'active':''}"><span class="ic"></span>Setup</button>
      </nav>
    `;
  }

  function renderSetup(){
    const t = settings.tms;
    return `
      ${topbar('Setup', 'Training maxes &amp; preferences', '../../')}
      <main>
        <div class="card">
          <h2>Units</h2>
          <label class="field">
            <span>Weight unit</span>
            <select id="f-unit">
              <option value="kg" ${settings.unit==='kg'?'selected':''}>Kilograms</option>

          </label>
          <label class="field">
            <span>Rounding increment</span>
            <select id="f-inc">
              <option value="1" ${settings.increment==1?'selected':''}>1</option>
              <option value="2.5" ${settings.increment==2.5?'selected':''}>2.5</option>
              <option value="5" ${settings.increment==5?'selected':''}>5</option>
            </select>
          </label>
          <label class="field">
            <span>Barbell weight (for plate suggestions)</span>
            <input type="number" inputmode="decimal" id="f-bar" value="${settings.barWeight ?? (settings.unit==='kg' ? 20 : 45)}">
          </label>
        </div>

        <div class="card">
          <h2>Training maxes</h2>
          <p class="sub" style="color:var(--muted);font-size:12px;margin:-6px 0 14px;">Use ~90% of your true 1-rep max.</p>
          <label class="field"><span>Squat</span><input type="number" inputmode="decimal" id="f-squat" value="${t.squat ?? ''}" placeholder="e.g. 120"></label>
          <label class="field"><span>Bench Press</span><input type="number" inputmode="decimal" id="f-bench" value="${t.bench ?? ''}" placeholder="e.g. 90"></label>
          <label class="field"><span>Deadlift</span><input type="number" inputmode="decimal" id="f-deadlift" value="${t.deadlift ?? ''}" placeholder="e.g. 140"></label>
          <label class="field"><span>Overhead Press</span><input type="number" inputmode="decimal" id="f-press" value="${t.press ?? ''}" placeholder="e.g. 55"></label>
        </div>

        <div class="card">
          <h2>Boring But Big</h2>
          <p class="sub" style="color:var(--muted);font-size:12px;margin:-6px 0 14px;">Done as the opposite lift — squat day supplements with deadlift, bench day with press, and vice versa.</p>
          <label class="field">
            <span>Supplemental work: 5×10 at</span>
            <select id="f-bbb">
              <option value="50" ${settings.bbbPercent==50?'selected':''}>50% of training max</option>
              <option value="60" ${settings.bbbPercent==60?'selected':''}>60% of training max</option>
              <option value="70" ${settings.bbbPercent==70?'selected':''}>70% of training max</option>
            </select>
          </label>
        </div>

        <button class="btn" data-action="saveSetup">Save</button>

        <div class="card" style="margin-top:22px;">
          <h2>Backup &amp; sync</h2>
          <p class="sub" style="color:var(--muted);font-size:12px;margin:-6px 0 14px;">iOS can clear local storage from unused home-screen apps. Export now and then. To back it up, upload the downloaded file to <b>apps/531-bbb/history.json</b> in your repo, overwriting the existing one. This app merges that file's history into what's on your phone automatically on launch (nothing is ever overwritten or removed), and reminds you here if the committed file is over a month old.</p>
          <div class="btn-row">
            <button class="btn secondary" data-action="exportData">Export history.json</button>
            <label class="btn secondary" for="import-file">Merge from file</label>
          </div>
          <input type="file" id="import-file" accept="application/json">
        </div>

        <div class="card" style="margin-top:22px;">
          <h2>Reset</h2>
          <p class="sub" style="color:var(--muted);font-size:12px;margin:-6px 0 14px;">Clears all training maxes and workout history on this phone.</p>
          <button class="btn danger" data-action="resetAll">Erase all data</button>
        </div>
      </main>
      ${hasTMs() ? tabs('setup') : ''}
    `;
  }

  function cycleCellContent(entry, isCurrent){
    if (entry){
      const top = entry.mainSets[entry.mainSets.length - 1];
      const repsLine = top.actualReps ? `${top.actualReps} reps` : (top.repsLabel ? top.repsLabel + ' reps' : '');
      return `<div class="cp-weight">${fmtW(top.weight)}</div>${repsLine ? `<div class="cp-reps">${repsLine}</div>` : ''}`;
    }
    if (isCurrent) return `<div class="cp-next">Next</div>`;
    return `<div class="cp-empty">—</div>`;
  }

  function renderCycleProgress(){
    const weeks = [1,2,3];
    const cols = settings.order;
    const isCurrentCycle = viewingCycle === state.cycle;
    const header = cols.map(l => `<div class="cp-cell cp-head"><div class="cp-icon ${LIFT_CLASS[l]}">${LIFT_ABBR[l]}</div></div>`).join('');
    const rows = weeks.map(wk => {
      const cells = cols.map((l,ci) => {
        const entry = history.find(h => h.cycle === viewingCycle && h.week === wk && h.lift === l);
        const isCurrent = isCurrentCycle && state.week === wk && state.dayIndex === ci;
        return `<button type="button" class="cp-cell ${entry ? 'cp-done' : ''} ${isCurrent ? 'cp-current' : ''}" data-action="cycleCell" data-week="${wk}" data-lift="${l}">${cycleCellContent(entry, isCurrent)}</button>`;
      }).join('');
      return `<div class="cp-row"><div class="cp-wk">W${wk}</div>${cells}</div>`;
    }).join('');
    return `
      <div class="card">
        <div class="cp-toolbar">
          <button type="button" class="cp-navbtn" data-action="cycleNav" data-dir="-1" ${viewingCycle<=1?'disabled':''} aria-label="Previous cycle">‹</button>
          <h2>Cycle ${viewingCycle}</h2>
          <button type="button" class="cp-navbtn" data-action="cycleNav" data-dir="1" ${isCurrentCycle?'disabled':''} aria-label="Next cycle">›</button>
          ${isCurrentCycle ? `<button type="button" class="cp-gear" data-action="openCycleTMEdit" aria-label="Edit training maxes">&#9881;</button>` : ''}
        </div>
        <p class="sub" style="color:var(--muted);font-size:12px;margin:6px 0 14px;">${isCurrentCycle ? 'Tap a completed workout to edit it, or an empty one to select it as your next session.' : 'Viewing a past cycle.'}</p>
        <div class="cp-grid">
          <div class="cp-row"><div class="cp-wk"></div>${header}</div>
          ${rows}
        </div>
      </div>
    `;
  }

  function renderHome(){
    if (!hasTMs()) { go('setup'); return renderSetup(); }
    const w = computeWorkout();
    const lift = w.lift;
    return `
      ${topbar('5/3/1 BBB', 'Cycle ' + state.cycle, '../../')}
      ${syncBanner()}
      <main>
        ${renderCycleProgress()}

        <div class="card" style="margin-top:22px;">
          <h2>Next workout</h2>
          <div class="lift-head">
            <div class="plate ${LIFT_CLASS[lift]}"></div>
            <div>
              <div class="name">${LIFT_LABEL[lift]}</div>
              <div class="meta">Week ${state.week} · ${w.scheme.label}</div>
            </div>
          </div>
          <div class="row"><span class="label">Top set</span><span class="value">${fmtW(w.mainSets[2].weight)} × ${w.mainSets[2].repsLabel}</span></div>
          <div class="row"><span class="label">BBB — ${LIFT_LABEL[w.bbbLift]}</span><span class="value">${fmtW(w.bbbWeight)} × 5×10</span></div>
        </div>
        <button class="btn" data-action="startWorkout">Start workout</button>
        <button class="btn ghost" data-action="pickDay">Choose a different day</button>

        <button class="btn secondary" style="margin-top:22px;" data-action="startNewCycle">Start new cycle</button>
      </main>
      ${tabs('531home')}
    `;
  }

  function renderTrain(){
    const w = computeWorkout();
    const lift = w.lift;
    const sw = ensureSessionWeights(w);

    // One continuous plate sequence across the whole session — warm-up
    // through BBB — so each stage's "add/remove" reflects what's actually
    // still loaded from the stage before it.
    const stageWeights = w.warmupSets.map(s => s.weight).concat(sw.main, [sw.bbb]);
    const plateStages = buildSessionPlateStages(stageWeights);
    const warmupCount = w.warmupSets.length;

    let warmupHtml = w.warmupSets.map((ws,i)=>{
      const plateLine = formatPlateStage(plateStages[i]);
      return `
        <div class="set-row">
          <div class="set-left">
            <div class="pct">${ws.pct}% of TM</div>
            <div class="weight">${fmtW(ws.weight)}</div>
            <div class="target">Target: ${ws.reps} reps</div>
            <div class="plate-line">${plateLine} per side</div>
          </div>
          <div class="set-right">
            <button type="button" class="done-tick ${warmupDone[i] ? 'done' : ''}" data-action="toggleSetDone" data-kind="warmup" data-idx="${i}" aria-label="Mark warm-up set ${i+1} done">&#10003;</button>
          </div>
        </div>
      `;
    }).join('');

    let setsHtml = w.mainSets.map((s,i)=>{
      const plateLine = formatPlateStage(plateStages[warmupCount + i]);

      const lt = lastTimeForSet(lift, state.week, i);
      const ltLine = lt
        ? `Last time: ${fmtW(lt.weight)} × ${lt.reps ?? lt.repsLabel}`
        : '';

      return `
        <div class="set-row">
          <div class="set-left">
            <div class="pct">${s.pct}% of TM</div>
            <div class="weight-edit">
              <input type="number" inputmode="decimal" step="${settings.increment || 2.5}" class="weight-input" data-set="${i}" value="${sw.main[i]}">
              <span class="unit">${settings.unit}</span>
            </div>
            <div class="target">Target: ${s.repsLabel} reps</div>
            <div class="plate-line">${plateLine} per side</div>
            ${ltLine ? `<div class="last-time">${ltLine}</div>` : ''}
          </div>
          <div class="set-right">
            ${s.amrap ? `<input class="reps" type="number" inputmode="numeric" placeholder="reps" id="amrap-${i}" value="${repsInput[i] ?? ''}">` : ''}
            <button type="button" class="done-tick ${mainDone[i] ? 'done' : ''}" data-action="toggleSetDone" data-kind="main" data-idx="${i}" aria-label="Mark main set ${i+1} done">&#10003;</button>
          </div>
        </div>
      `;
    }).join('');

    const bbbPlateLine = formatPlateStage(plateStages[warmupCount + 3]);
    const bbbLast = lastTimeForBBB(w.bbbLift);
    const bbbLastLine = bbbLast ? `Last time: ${fmtW(bbbLast.weight)} × ${bbbLast.sets}/5 sets` : '';

    let bbbDots = '';
    for (let i=0;i<5;i++){
      bbbDots += `<div class="bbb-dot ${i < bbbDone ? 'done':''}" data-action="toggleBbb" data-i="${i}">${i+1}</div>`;
    }

    return `
      ${topbar('Today', 'Week ' + state.week + ' · ' + w.scheme.label, null, '531home', true)}
      <main>
        <div class="card">
          <div class="lift-head">
            <div class="plate ${LIFT_CLASS[lift]}"></div>
            <div>
              <div class="name">${LIFT_LABEL[lift]}</div>
              <div class="meta">Training max ${fmtW(w.tm)}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>Warm-up</h2>
          ${warmupHtml}
        </div>

        <div class="card">
          <h2>Main sets</h2>
          ${setsHtml}
        </div>

        <div class="card">
          <h2>Boring But Big — ${LIFT_LABEL[w.bbbLift]}</h2>
          <div class="row">
            <span class="label">5 sets × 10 reps</span>
            <span class="value bbb-weight-edit"><input type="number" inputmode="decimal" step="${settings.increment || 2.5}" id="bbbWeightInput" value="${sw.bbb}"> ${settings.unit}</span>
          </div>
          <div class="plate-line">${bbbPlateLine} per side</div>
          ${bbbLastLine ? `<div class="last-time">${bbbLastLine}</div>` : ''}
          <div class="bbb-counter">${bbbDots}</div>
        </div>

        <button class="btn" data-action="finishWorkout">Finish &amp; log workout</button>
      </main>
      <div class="rest-timer ${restEndsAt ? '' : 'hidden'}" id="restTimer">
        <span class="rt-label">Resting</span>
        <span class="rt-time" id="restTimerLabel">${restLabelText()}</span>
        <button type="button" class="rt-skip" data-action="skipRest">Skip</button>
      </div>
    `;
  }

  function historySubtabs(){
    return `

      prLine = `<span class="hi-pr">${top.actualReps} reps @ ${fmtW(top.weight)} · est. 1RM ${fmtW(e1rm)}</span>`;

    return `
      <div class="history-item">

  function renderHistory(){
    if (historyTab === 'progress'){

        ${topbar('History', history.length + ' workouts logged', null, '531home')}
        ${historySubtabs()}
        <main>${renderProgressBody()}</main>

    if (!history.length){
      return `
        ${topbar('History', null, null, '531home')}
        ${historySubtabs()}
        <main>
          <div class="empty">
            <div class="big">—</div>
            <div>No workouts logged yet.<br>Finish a session to see it here.</div>
          </div>

        ${tabs('history')}
      `;

    const filtered = historyLiftFilter === 'all' ? history : history.filter(h => h.lift === historyLiftFilter);

    let body;
    if (!filtered.length){
      body = `<div class="empty"><div class="big">—</div><div>No ${LIFT_LABEL[historyLiftFilter]} workouts logged yet.</div></div>`;
    } else if (historyLiftFilter === 'all'){
      body = settings.order.map(l => {
        const items = history.filter(h => h.lift === l);
        if (!items.length) return '';
        const rows = items.slice().reverse().map(renderHistoryItem).join('');
        return `<div class="history-group"><div class="hg-title">${LIFT_LABEL[l]}</div>${rows}</div>`;
      }).join('');
    } else {
      body = filtered.slice().reverse().map(renderHistoryItem).join('');
    }

    return `
      ${topbar('History', history.length + ' workouts logged', null, '531home')}
      ${historySubtabs()}
      ${liftFilterChips()}
      <main>${body}</main>
      ${tabs('history')}
    `;
  }

  const LIFT_COLOR = { squat:'var(--steel)', bench:'var(--brass)', deadlift:'var(--iron)', press:'var(--moss)' };

  function e1rmSeries(lift){
    return history
      .filter(h => h.lift === lift)
      .map(h => {
        const top = h.mainSets[h.mainSets.length-1];
        if (!top.amrap || !top.actualReps) return null;
        return { date: h.date, v: Math.round(epley(top.weight, top.actualReps)) };
      })
      .filter(Boolean)
      .sort((a,b) => a.date.localeCompare(b.date));
  }

  function buildSparkline(points, color){
    if (points.length < 2) return null;
    const W = 320, H = 150;
    const mLeft = 40, mRight = 12, mTop = 14, mBottom = 24;
    const plotW = W - mLeft - mRight;
    const plotH = H - mTop - mBottom;

    const values = points.map(p=>p.v);
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max - min) || 1;
    const stepX = points.length > 1 ? plotW / (points.length - 1) : 0;

    const coords = points.map((p,i)=>{
      const x = mLeft + i*stepX;
      const y = mTop + plotH - ((p.v - min)/range) * plotH;
      return [x,y];
    });
    const path = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
    const dots = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="${color}"/>`).join('');

    const gridLines = `
      <line x1="${mLeft}" y1="${mTop}" x2="${W-mRight}" y2="${mTop}" stroke="var(--line)" stroke-width="1"/>
      <line x1="${mLeft}" y1="${mTop+plotH}" x2="${W-mRight}" y2="${mTop+plotH}" stroke="var(--line)" stroke-width="1"/>
    `;
    const yLabels = `
      <text x="${mLeft-6}" y="${mTop+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtW(max)}</text>
      <text x="${mLeft-6}" y="${mTop+plotH+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtW(min)}</text>
    `;
    const showAll = points.length <= 6;
    const xLabels = coords.map((c,i)=>{
      if (!showAll && i !== 0 && i !== coords.length-1) return '';
      const d = new Date(points[i].date);
      const label = isNaN(d) ? points[i].date : (d.getMonth()+1) + '/' + d.getDate();
      return `<text x="${c[0].toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${label}</text>`;
    }).join('');

    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="140" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
      ${dots}
      ${yLabels}
      ${xLabels}
    </svg>`;
  }

  function renderProgressBody(){
    const lifts = ['squat','bench','deadlift','press'];
    return lifts.map(lift=>{
      const pts = e1rmSeries(lift);
      const svg = buildSparkline(pts, LIFT_COLOR[lift]);
      const latest = pts.length ? pts[pts.length-1].v : null;
      return `
        <div class="card chart-card">
          <div class="lift-head" style="margin-bottom:6px;">
            <div class="plate ${LIFT_CLASS[lift]}"></div>
            <div>
              <div class="name" style="font-size:18px;">${LIFT_LABEL[lift]}</div>
              <div class="meta">Estimated 1-rep max, from logged AMRAP sets</div>
            </div>
          </div>
          ${svg ? svg : `<div class="chart-empty">Log at least two AMRAP sets for this lift to see a trend.</div>`}
          ${latest !== null ? `<div class="chart-latest">${fmtW(latest)}<span class="u">latest estimate</span></div>` : ''}
        </div>
      `;
    }).join('');
  }

  /* ---------------- actions ---------------- */
  function bindEvents(){
    document.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', onAction);
    });
    const fileInput = document.getElementById('import-file');
    if (fileInput) fileInput.addEventListener('change', handleImportChange);

    document.querySelectorAll('.weight-input').forEach(el=>{
      el.addEventListener('change', () => {
        const i = +el.getAttribute('data-set');
        const v = parseFloat(el.value);
        if (!isNaN(v) && v >= 0 && sessionWeights) sessionWeights.main[i] = v;
        render();
      });
    });

    const bbbWeightInput = document.getElementById('bbbWeightInput');
    if (bbbWeightInput){
      bbbWeightInput.addEventListener('change', () => {
        const v = parseFloat(bbbWeightInput.value);
        if (!isNaN(v) && v >= 0 && sessionWeights) sessionWeights.bbb = v;
        render();
      });
    }
  }

  function onAction(e){
    const el = e.currentTarget;
    const action = el.getAttribute('data-action');
    if (action === 'go') go(el.getAttribute('data-route'));
    else if (action === 'saveSetup') doSaveSetup();
    else if (action === 'resetAll') doResetAll();
    else if (action === 'startWorkout') go('train');
    else if (action === 'pickDay') doPickDay();
    else if (action === 'toggleBbb') doToggleBbb(parseInt(el.getAttribute('data-i')));
    else if (action === 'finishWorkout') doFinishWorkout();
    else if (action === 'deleteHistory') doDeleteHistory(parseInt(el.getAttribute('data-idx')));
    else if (action === 'applyCycleUp') doApplyCycleUp();
    else if (action === 'skipCycleUp') doSkipCycleUp();
    else if (action === 'setHistoryTab') { historyTab = el.getAttribute('data-tab'); render(); }
    else if (action === 'editHistory') doEditHistory(parseInt(el.getAttribute('data-idx')));
    else if (action === 'cancelEditHistory') doCancelEditHistory();
    else if (action === 'saveEditHistory') doSaveEditHistory();
    else if (action === 'exportData') doExportData();
    else if (action === 'exportFromReminder') { doExportData(); doDismissStaleReminder(); }
    else if (action === 'dismissStaleReminder') doDismissStaleReminder();
    else if (action === 'startNewCycle') doStartNewCycle();
    else if (action === 'cycleCell') doCycleCellClick(parseInt(el.getAttribute('data-week')), el.getAttribute('data-lift'));
    else if (action === 'skipRest') stopRest();
    else if (action === 'cycleNav') {
      viewingCycle = Math.max(1, Math.min(state.cycle, viewingCycle + parseInt(el.getAttribute('data-dir'))));
      render();
    }
    else if (action === 'pdSelectLift') { pendingPickDay.dayIndex = parseInt(el.getAttribute('data-idx')); render(); }
    else if (action === 'pdSelectWeek') { pendingPickDay.week = parseInt(el.getAttribute('data-week')); render(); }
    else if (action === 'confirmPickDay') doConfirmPickDay();
    else if (action === 'cancelPickDay') { pendingPickDay = null; render(); }
    else if (action === 'openCycleTMEdit') { pendingCycleTMEdit = Object.assign({}, settings.tms); render(); }
    else if (action === 'cancelCycleTMEdit') { pendingCycleTMEdit = null; render(); }
    else if (action === 'saveCycleTMEdit') doSaveCycleTMEdit();
    else if (action === 'setHistoryLift') { historyLiftFilter = el.getAttribute('data-lift'); render(); }
    else if (action === 'toggleSetDone') doToggleSetDone(el.getAttribute('data-kind'), parseInt(el.getAttribute('data-idx')));
    else if (action === 'cancelStartCycle') { pendingStartCycleConfirm = null; render(); }
    else if (action === 'confirmStartCycle') doConfirmStartNewCycle();
    else if (action === 'backDiscardConfirm') { pendingDiscardConfirm = el.getAttribute('data-route'); render(); }
    else if (action === 'cancelDiscardWorkout') { pendingDiscardConfirm = null; render(); }
    else if (action === 'confirmDiscardWorkout') { const r = pendingDiscardConfirm; pendingDiscardConfirm = null; go(r); }
  }

  // Toggling a set's tick is what marks it complete — it also starts that
  // set-type's rest countdown. Tapping it again just clears the flag.
  function doToggleSetDone(kind, idx){
    if (kind === 'warmup'){
      warmupDone[idx] = !warmupDone[idx];
      if (warmupDone[idx]) startRest(REST_WARMUP);
    } else if (kind === 'main'){
      mainDone[idx] = !mainDone[idx];
      if (mainDone[idx]) startRest(REST_MAIN);
    }
    render();
  }

  // A done cell opens that workout for editing. An empty cell (current cycle
  // only) selects it as the next session — it no longer jumps straight into
  // Train; the user presses "Start workout" separately.
  function doCycleCellClick(wk, lift){
    const entry = history.find(h => h.cycle === viewingCycle && h.week === wk && h.lift === lift);
    if (entry){
      editingHistoryIdx = history.indexOf(entry);
      render();
      return;
    }
    if (viewingCycle !== state.cycle) return;
    const dayIdx = settings.order.indexOf(lift);
    if (dayIdx === -1) return;
    state.week = wk;
    state.dayIndex = dayIdx;
    save(TKEY, state);
    render();
  }

  function readNum(id){
    const v = parseFloat(document.getElementById(id).value);
    return isNaN(v) ? null : v;
  }

  function doSaveSetup(){
    const squat = readNum('f-squat'), bench = readNum('f-bench'),
          deadlift = readNum('f-deadlift'), press = readNum('f-press');
    if (!squat || !bench || !deadlift || !press){
      showToast('Enter all four training maxes.');
      return;
    }
    settings.unit = document.getElementById('f-unit').value;
    settings.increment = parseFloat(document.getElementById('f-inc').value);
    settings.barWeight = parseFloat(document.getElementById('f-bar').value) || (document.getElementById('f-unit').value === 'kg' ? 20 : 45);
    settings.bbbPercent = parseInt(document.getElementById('f-bbb').value);
    settings.tms = { squat, bench, deadlift, press };
    save(SKEY, settings);
    showToast('Setup saved.');
    go('531home');
  }

  function doResetAll(){
    if (!confirm('This erases every training max and logged workout. Continue?')) return;
    settings = defaultSettings();
    state = defaultState();
    history = [];
    save(SKEY, settings); save(TKEY, state); save(HKEY, history);
    showToast('All data erased.');
    go('setup');
  }

  function doPickDay(){
    pendingPickDay = { dayIndex: state.dayIndex, week: state.week };
    render();
  }

    state.dayIndex = pendingPickDay.dayIndex;
    state.week = pendingPickDay.week;
    save(TKEY, state);
    pendingPickDay = null;
    render();

  function doSaveCycleTMEdit(){
    const squat = parseFloat(document.getElementById('ct-squat').value);
    const bench = parseFloat(document.getElementById('ct-bench').value);
    const deadlift = parseFloat(document.getElementById('ct-deadlift').value);
    const press = parseFloat(document.getElementById('ct-press').value);
    settings.tms = {
      squat: isNaN(squat) ? settings.tms.squat : squat,
      bench: isNaN(bench) ? settings.tms.bench : bench,
      deadlift: isNaN(deadlift) ? settings.tms.deadlift : deadlift,
      press: isNaN(press) ? settings.tms.press : press
    };
    save(SKEY, settings);
    pendingCycleTMEdit = null;
    showToast('Training maxes updated.');

  }

  function doToggleBbb(i){
    // tapping a dot sets completed count to i+1, tapping the currently-last done dot un-marks it
    const was = bbbDone;
    bbbDone = (bbbDone === i+1) ? i : i+1;
    if (bbbDone > was) startRest(REST_BBB);
    render();
  }

  function doFinishWorkout(){
    const w = computeWorkout();
    const sw = ensureSessionWeights(w);
    const mainSets = w.mainSets.map((s,i)=>{
      const out = { pct:s.pct, repsLabel:s.repsLabel, weight:sw.main[i], amrap:s.amrap };
      if (s.amrap){
        const inp = document.getElementById('amrap-'+i);
        const val = inp ? parseInt(inp.value) : null;
        out.actualReps = (val && val>0) ? val : null;
      }
      return out;
    });
    const entry = {
      date: new Date().toISOString().slice(0,10),
      lift: w.lift,
      cycle: state.cycle,
      week: state.week,
      weekLabel: w.scheme.label,
      mainSets,
      bbbLift: w.bbbLift,
      bbbWeight: sw.bbb,
      bbbSets: bbbDone
    };
    history.push(entry);
    save(HKEY, history);

    sessionWeights = null;
    advanceDay();
    showToast('Workout logged.');
    go('531home');
  }

  // Cycles are never advanced automatically — finishing week 3's last lift
  // just stays there. The user starts the next cycle explicitly from the
  // "Start new cycle" button in the cycle progress card.
  function advanceDay(){
    state.dayIndex++;
    if (state.dayIndex >= settings.order.length){
      state.dayIndex = 0;
      if (state.week < 3) state.week++;
    }
    save(TKEY, state);
  }

  function queueCycleUp(){
    const bumps = settings.unit === 'kg' ? CYCLE_BUMP : CYCLE_BUMP_LB;
    pendingCycleUp = { tms: {
      squat: settings.tms.squat + bumps.squat,
      bench: settings.tms.bench + bumps.bench,
      deadlift: settings.tms.deadlift + bumps.deadlift,
      press: settings.tms.press + bumps.press
    }};
  }

  function doStartNewCycle(){
    pendingStartCycleConfirm = true;
    render();
  }

  function doConfirmStartNewCycle(){
    pendingStartCycleConfirm = null;
    state.dayIndex = 0;
    state.week = 1;
    state.cycle++;
    save(TKEY, state);
    viewingCycle = state.cycle;
    queueCycleUp();
    render();
  }

  function doApplyCycleUp(){
    settings.tms = {
      squat: parseFloat(document.getElementById('cu-squat').value) || settings.tms.squat,
      bench: parseFloat(document.getElementById('cu-bench').value) || settings.tms.bench,
      deadlift: parseFloat(document.getElementById('cu-deadlift').value) || settings.tms.deadlift,
      press: parseFloat(document.getElementById('cu-press').value) || settings.tms.press
    };
    save(SKEY, settings);
    pendingCycleUp = null;
    render();
  }
  function doSkipCycleUp(){ pendingCycleUp = null; render(); }

  function doDeleteHistory(idx){
    if (!confirm('Delete this workout entry?')) return;
    history.splice(idx,1);
    save(HKEY, history);
    render();
  }

  function doEditHistory(idx){ editingHistoryIdx = idx; render(); }
  function doCancelEditHistory(){ editingHistoryIdx = null; render(); }

  function doSaveEditHistory(){
    const idx = editingHistoryIdx;
    const h = history[idx];
    if (!h) { editingHistoryIdx = null; render(); return; }

    const dateVal = document.getElementById('eh-date').value;
    if (dateVal) h.date = dateVal;

    h.mainSets = h.mainSets.map((s,i)=>{
      const wEl = document.getElementById('eh-w-'+i);
      const w = wEl ? parseFloat(wEl.value) : NaN;
      const out = Object.assign({}, s, { weight: isNaN(w) ? s.weight : w });
      if (s.amrap){
        const rEl = document.getElementById('eh-r-'+i);
        const r = rEl ? parseInt(rEl.value) : NaN;
        out.actualReps = (!isNaN(r) && r > 0) ? r : null;
      }
      return out;
    });

    const bbbEl = document.getElementById('eh-bbb');
    const bbbVal = bbbEl ? parseInt(bbbEl.value) : NaN;
    h.bbbSets = isNaN(bbbVal) ? h.bbbSets : Math.max(0, Math.min(5, bbbVal));

    history[idx] = h;
    save(HKEY, history);
    editingHistoryIdx = null;
    showToast('Workout updated.');
    render();
  }

  function doExportData(){
    const payload = { exportedAt: new Date().toISOString(), app:'531-bbb', settings, state, history };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'history.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Downloaded history.json');
  }

  function historyKey(h){
    const top = h.mainSets[h.mainSets.length-1];
    return [h.date, h.lift, h.cycle, h.week, h.mainSets.map(s=>s.weight).join(','), top.actualReps ?? ''].join('|');
  }

  function mergeHistoryArrays(a, b){
    const map = new Map();
    a.forEach(h => map.set(historyKey(h), h));
    b.forEach(h => map.set(historyKey(h), h));
    return Array.from(map.values()).sort((x,y) => x.date.localeCompare(y.date));
  }

  function handleImportChange(e){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data.history)) throw new Error('bad format');
        const before = history.length;
        history = mergeHistoryArrays(history, data.history);
        const added = history.length - before;
        save(HKEY, history);
        if (!hasTMs() && data.settings){
          settings = data.settings;
          save(SKEY, settings);
        }
        showToast(added > 0 ? `Merged in ${added} new ${added === 1 ? 'entry' : 'entries'}.` : 'Nothing new to merge in.');
        go('531home');
      }catch(err){
        showToast('That file could not be read as a backup.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  /* ---------------- remote history merge + backup-age check ---------------- */
  const STALE_DAYS = 30;
  const DISMISS_SNOOZE_DAYS = 3;

  function checkRemoteHistory(){
    fetch('./history.json?t=' + Date.now(), { cache:'no-store' })
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (!data) return;
        let changed = false;

        if (Array.isArray(data.history)){
          const merged = mergeHistoryArrays(history, data.history);
          if (merged.length !== history.length){
            history = merged;
            save(HKEY, history);
            changed = true;
          }
        }

        if (!hasTMs() && data.settings){
          settings = data.settings;
          save(SKEY, settings);
          changed = true;
        }

        if (data.exportedAt){
          const dismissedAt = localStorage.getItem('531_staleDismissedAt');
          const snoozed = dismissedAt && (Date.now() - new Date(dismissedAt).getTime() < DISMISS_SNOOZE_DAYS * 24 * 60 * 60 * 1000);
          if (!snoozed){
            const days = Math.floor((Date.now() - new Date(data.exportedAt).getTime()) / (24 * 60 * 60 * 1000));
            if (days >= STALE_DAYS){
              pendingStaleReminder = { exportedAt: data.exportedAt, days };
              changed = true;
            }
          }
        }

        if (changed) render();
      })
      .catch(()=>{ /* no committed backup yet, or offline — ignore silently */ });
  }

  function doDismissStaleReminder(){
    localStorage.setItem('531_staleDismissedAt', new Date().toISOString());
    pendingStaleReminder = null;
    render();
  }

  /* ---------------- boot ---------------- */
  go(hasTMs() ? '531home' : 'setup');
  checkRemoteHistory();
})();
</script>
</body>
</html>
